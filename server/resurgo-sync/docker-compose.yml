# CANDIDAT : à déployer seulement après audit du NAS et recette de sécurité.
# Ne jamais exposer le port privé 18880 via Tailscale Funnel.
# QNAP Container Station : utiliser le réseau Docker 'bridge' existant.
# Ne PAS créer de réseau Compose server_default (qnetwork-tool / Virtual Switch échoue).
services:
  resurgo-sync-public:
    build: .
    network_mode: bridge  # réseau Docker existant, pas de création de Virtual Switch QNAP
    container_name: resurgo-sync-public
    command: ["uvicorn", "app:public", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    restart: unless-stopped
    env_file: .env
    environment:
      RS_DB_PATH: /data/resurgo.sqlite3
    ports:
      - "127.0.0.1:${RS_PUBLIC_HOST_PORT:-18879}:8080"
    volumes:
      - ${RS_HOST_DATA_DIR:?Configurer un volume absolu NAS distinct de AlphaTerminal}:/data
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 192m
    pids_limit: 64

  resurgo-sync-admin:
    build: .
    network_mode: bridge  # réseau Docker existant, pas de création de Virtual Switch QNAP
    container_name: resurgo-sync-admin
    command: ["uvicorn", "app:admin", "--host", "0.0.0.0", "--port", "8081", "--no-access-log"]
    restart: unless-stopped
    env_file: .env
    environment:
      RS_DB_PATH: /data/resurgo.sqlite3
    ports:
      - "127.0.0.1:${RS_ADMIN_HOST_PORT:-18880}:8081"
    volumes:
      - ${RS_HOST_DATA_DIR:?Configurer un volume absolu NAS distinct de AlphaTerminal}:/data
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 192m
    pids_limit: 64

  # Worker optionnel, sans port, et réseau Docker bridge déjà existant.
  resurgo-push-worker:
    profiles: ["push"]
    build: .
    network_mode: bridge
    container_name: resurgo-push-worker
    command: ["python3", "-m", "push_worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      RS_DB_PATH: /data/resurgo.sqlite3
      RS_VAPID_SUBJECT: "https://sicho95.github.io"
    volumes:
      - ${RS_HOST_DATA_DIR:?Configurer RS_HOST_DATA_DIR absolu et privé}:/data
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 192m
    pids_limit: 64
