name: ResurGo NAS sync candidate tests
on:
  push:
    branches: [feature/resurgo-sync-funnel-20261030]
    paths:
      - "server/resurgo-sync/**"
      - "app/**"
      - "scripts/build-static.mjs"
      - "tests/resurgo-backup.test.mjs"
      - ".github/workflows/resurgo-sync-candidate-tests.yml"
  pull_request:
    paths:
      - "server/resurgo-sync/**"
      - "app/**"
      - "scripts/build-static.mjs"
      - "tests/resurgo-backup.test.mjs"
      - ".github/workflows/resurgo-sync-candidate-tests.yml"
jobs:
  test-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/resurgo-sync/requirements-test.txt
      - run: python -m pytest -q server/resurgo-sync/tests
  test-backup-pwa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/resurgo-backup.test.mjs
      - run: node scripts/build-static.mjs --out .webapp-build
      - run: node --check .webapp-build/app.js
