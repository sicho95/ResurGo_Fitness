name: ResurGo Edge neural voices v2 (same identities as Histoire)
on:
  push:
    branches: [feature/resurgo-sync-funnel-20261030]
    paths:
      - "scripts/generate-edge-voice-pack.py"
      - ".github/workflows/generate-resurgo-voices-edge.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same engine as Histoire
        run: python -m pip install "edge-tts>=7,<9"
      - name: Generate MP3 audio with two locked neural voices
        run: python scripts/generate-edge-voice-pack.py --out static/voice/fr-FR/v2 --jobs 3
      - name: Validate manifest, all 160 tracks and negation hashes
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          d=pathlib.Path('static/voice/fr-FR/v2')
          m=json.loads((d/'manifest.json').read_text())
          assert len(m['files'])==160
          assert m['voices']['masculine']['providerVoiceId']=='fr-FR-RemyMultilingualNeural'
          assert m['voices']['feminine']['providerVoiceId']=='fr-FR-VivienneMultilingualNeural'
          for key,item in m['files'].items():
              f=d/item['src']
              assert f.exists() and f.stat().st_size>2000,key
              assert hashlib.sha256(f.read_bytes()).hexdigest()==item['sha256'],key
              assert hashlib.sha256(item['text'].encode()).hexdigest()==item['textSha256'],key
          print('160 tracks validated')
          PY
      - name: Attach audio preview
        uses: actions/upload-artifact@v4
        with:
          name: resurgo-edge-v2-vivienne-remy-preview
          path: static/voice/fr-FR/v2
          retention-days: 30
      - name: Commit generated audio on candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/voice/fr-FR/v2/
          if ! git diff --cached --quiet; then
            git commit -m "assets(voices): Vivienne et Remy Edge neural 160 clips"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
